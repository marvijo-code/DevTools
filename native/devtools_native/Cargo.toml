[package]
name = "devtools_native"
version = "0.1.0"
edition = "2021"
description = "Native Windows filesystem scanner and parallel deleter for DevTools"
license = "MIT"

[lib]
name = "devtools_native"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
